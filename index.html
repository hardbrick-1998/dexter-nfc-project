<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXTER NFC - System</title>
    
    <!-- ==========================================
         STEP 1: CSS / TAMPILAN VISUAL (STYLING)
         ========================================== -->
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        h2 { color: #333; margin-bottom: 5px; }
        p { margin-top: 0; color: #666; }
        
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 10px auto; }
        
        /* Tombol Scan Utama */
        .btn-scan { padding: 15px 30px; font-size: 18px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px;}
        .btn-scan:active { background-color: #218838; }
        
        /* Kotak Output */
        #output { margin-top: 15px; font-size: 15px; font-weight: bold; color: #666; padding: 15px; border: 2px dashed #ccc; border-radius: 8px; white-space: pre-line;}
        
        /* Mode Admin UI */
        .admin-trigger { margin-top: 30px; background: none; border: none; color: #aaa; cursor: pointer; font-size: 14px; text-decoration: underline; }
        #adminPanel { display: none; background-color: #fff3cd; border: 2px solid #ffeeba; }
        .input-box { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        .btn-write { padding: 12px 20px; font-size: 16px; background-color: #fd7e14; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px;}
        .btn-write:active { background-color: #e86c00; }
    </style>
</head>
<body>

    <!-- ==========================================
         STEP 2: UI UTAMA (HALAMAN SCAN MEKANIK)
         ========================================== -->
    <div class="card">
        <h2>Project DEXTER</h2>
        <p>Flowmeter Tagging System</p>
        
        <div id="output">Siap untuk scan...</div>
        <button id="scanButton" class="btn-scan">Tap Keyfob NFC</button>
    </div>

    <!-- ==========================================
         STEP 3: UI ADMIN (HALAMAN WRITE TERSEMBUNYI)
         ========================================== -->
    <button id="showAdminBtn" class="admin-trigger">⚙️ Akses Admin (Write)</button>

    <div id="adminPanel" class="card">
        <h3 style="color: #856404; margin-top: 0;">🛠️ Admin: Write Keyfob</h3>
        
        <input type="text" id="tipeInput" class="input-box" placeholder="Tipe (Cth: Flowmeter LC M7)" value="Flowmeter LC M7">
        <input type="text" id="snInput" class="input-box" placeholder="Nomor SN (Cth: 114816804)">
        
        <button id="writeButton" class="btn-write">Tulis ke Keyfob ✍️</button>
        <div id="writeOutput" style="margin-top: 10px; font-size: 14px; font-weight: bold;"></div>
    </div>

    <!-- ==========================================
         JAVASCRIPT (LOGIKA APLIKASI DEXTER)
         ========================================== -->
    <script>
        // --- STEP 4: KONFIGURASI URL & PASSWORD ---
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwO1XN3TclSGB_c3-o71uK5y87lF0fQ-7a2W-8XjWqD2u1KqX8X7F0X4QyL0m4/exec"; 
        const ADMIN_PASSWORD = "dexternfc"; 

        // --- STEP 5: VARIABEL GLOBAL (STATUS SENSOR) ---
        let ndef = null;
        let activeMode = "IDLE"; // Mencegah bentrok. Status: IDLE, READ, atau WRITE
        let dataToFormat = ""; 

        // --- STEP 6: FUNGSI UTAMA SENSOR NFC (POLISI LALU LINTAS) ---
        async function startNFC() {
            if (!('NDEFReader' in window)) {
                alert("⚠️ Browser HP tidak support NFC. Gunakan Chrome Android.");
                return;
            }

            if (!ndef) {
                ndef = new NDEFReader();
                try {
                    await ndef.scan(); // Standby di background
                    
                    ndef.onreading = async event => {
                        // Jika tidak ada tombol yang ditekan (IDLE), abaikan NFC
                        if (activeMode === "IDLE") return; 

                        const tagId = event.serialNumber;

                        // ---- JALUR 6A: MODE WRITE (ADMIN) ----
                        if (activeMode === "WRITE") {
                            activeMode = "IDLE"; // Langsung kunci sensor agar tidak dobel
                            
                            const writeOut = document.getElementById('writeOutput');
                            try {
                                await ndef.write(dataToFormat);
                                writeOut.style.color = "#007bff";
                                writeOut.innerText = `✅ Menulis UID: ${tagId}\nMengirim data ke Spreadsheet...`;

                                await fetch(BACKEND_URL, {
                                    method: "POST", mode: "no-cors",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ tag_id: tagId, tag_text: dataToFormat })
                                });

                                writeOut.style.color = "#28a745";
                                writeOut.innerText = `✅ Aset Baru Terdaftar!\n"${dataToFormat}"`;
                                document.getElementById('snInput').value = ""; // Kosongkan form otomatis
                            } catch (err) {
                                writeOut.style.color = "#d9534f";
                                writeOut.innerText = `❌ Gagal Write. Coba tekan tombol lagi.`;
                            }
                        } 
                        
                        // ---- JALUR 6B: MODE READ (MEKANIK) ----
                        else if (activeMode === "READ") {
                            activeMode = "IDLE"; // Langsung kunci sensor agar tidak dobel
                            
                            const outputScan = document.getElementById('output');
                            let tagText = "Tidak ada teks tertulis";

                            if (event.message && event.message.records && event.message.records.length > 0) {
                                for (const record of event.message.records) {
                                    if (record.recordType === "text") {
                                        const textDecoder = new TextDecoder(record.encoding);
                                        tagText = textDecoder.decode(record.data);
                                        break;
                                    }
                                }
                            }

                            outputScan.style.color = "#007bff";
                            outputScan.innerText = `✅ UID: ${tagId}\n📝 Teks: ${tagText}\n\nMengirim ke Spreadsheet...`;
                            
                            try {
                                await fetch(BACKEND_URL, {
                                    method: "POST", mode: "no-cors",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ tag_id: tagId, tag_text: tagText })
                                });
                                
                                outputScan.style.color = "#28a745";
                                outputScan.innerText = `✅ Sukses!\nData ${tagText} terkirim.`;
                            } catch (err) {
                                outputScan.style.color = "#d9534f";
                                outputScan.innerText = "❌ Gagal kirim ke server.";
                            }
                        }
                    };
                } catch (error) {
                    console.log("Error start NFC:", error);
                }
            }
        }

        // --- STEP 7: LOGIKA KLIK TOMBOL UI ---
        
        // Tombol 7A: Klik Scan Utama
        document.getElementById('scanButton').addEventListener('click', async () => {
            document.getElementById('output').innerText = "⏳ Mode SCAN Aktif.\nTempelkan NFC di belakang HP...";
            document.getElementById('output').style.color = "#f0ad4e";
            document.getElementById('writeOutput').innerText = ""; 
            activeMode = "READ"; 
            await startNFC();
        });

        // Tombol 7B: Buka Panel Password Admin
        const showAdminBtn = document.getElementById('showAdminBtn');
        const adminPanel = document.getElementById('adminPanel');

        showAdminBtn.addEventListener('click', () => {
            const pass = prompt("Masukkan Password Admin DEXTER:");
            if (pass === ADMIN_PASSWORD) {
                adminPanel.style.display = "block";
                showAdminBtn.style.display = "none"; 
            } else if (pass !== null) {
                alert("❌ Password Salah!");
            }
        });

        // Tombol 7C: Klik Write Data ke NFC
        document.getElementById('writeButton').addEventListener('click', async () => {
            const tipe = document.getElementById('tipeInput').value.trim();
            const sn = document.getElementById('snInput').value.trim();
            const writeOut = document.getElementById('writeOutput');

            if (!tipe || !sn) {
                alert("Tipe dan Nomor SN tidak boleh kosong!");
                return;
            }

            dataToFormat = `${tipe} - SN : ${sn}`;
            writeOut.style.color = "#e86c00";
            writeOut.innerText = "⏳ Mode WRITE Aktif.\nTempelkan Keyfob kosong ke HP...";
            document.getElementById('output').innerText = "Siap untuk scan..."; 
            activeMode = "WRITE"; 
            await startNFC();
        });
    </script>
</body>
</html>
