<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXTER NFC Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; background-color: #f4f4f9; }
        h2 { color: #333; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        button { padding: 15px 30px; font-size: 18px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold;}
        button:active { background-color: #218838; }
        #output { margin-top: 20px; font-size: 16px; font-weight: bold; color: #666; padding: 15px; border: 2px dashed #ccc; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Project DEXTER</h2>
        <p>Flowmeter Tagging System</p>
        
        <div id="output">Siap untuk scan...</div>
        <button id="scanButton">Tap Keyfob NFC</button>
    </div>

    <script>
        // MAS FAIZ: Wajib ganti tulisan di bawah ini dengan link "Web App URL" dari Google Apps Script
        const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzynzyPp1OQywvjxz3BeBolAGfIDf8-uX6al_qoqX3NY-67sVVpYyMsXt1ZyJ86JmWXxQ/exec"; 

        document.getElementById('scanButton').addEventListener('click', async () => {
            const output = document.getElementById('output');
            
            try {
                if ('NDEFReader' in window) {
                    output.style.color = "#f0ad4e";
                    output.innerText = "⏳ Tempelkan NFC di belakang HP...";
                    
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    
                    ndef.onreadingerror = () => {
                        output.style.color = "#d9534f";
                        output.innerText = "❌ Gagal baca. Coba geser sedikit posisinya.";
                    };

                    ndef.onreading = async event => {
                        const tagId = event.serialNumber;
                        let tagText = "Tidak ada teks tertulis";

                        // Logika untuk membaca pesan teks (NDEF) di dalam memori chip
                        if (event.message && event.message.records && event.message.records.length > 0) {
                            for (const record of event.message.records) {
                                if (record.recordType === "text") {
                                    const textDecoder = new TextDecoder(record.encoding);
                                    tagText = textDecoder.decode(record.data);
                                    break; // Berhenti mencari kalau teks sudah ketemu
                                }
                            }
                        }

                        output.style.color = "#007bff";
                        // Tampilkan UID dan Teks di layar HP
                        output.innerText = `✅ UID: ${tagId}\n📝 Teks: ${tagText}\nMengirim ke Spreadsheet...`;
                        
                        // Proses kirim data ke Google Apps Script
                        try {
                            await fetch(BACKEND_URL, {
                                method: "POST",
                                mode: "no-cors",
                                headers: { "Content-Type": "application/json" },
                                // Kita kirim UID dan Teks-nya sekaligus ke database!
                                body: JSON.stringify({ tag_id: tagId, tag_text: tagText }) 
                            });
                            
                            output.style.color = "#28a745";
                            output.innerText = `✅ Sukses!\nData ${tagText} terkirim.`;
                            
                        } catch (err) {
                            output.style.color = "#d9534f";
                            output.innerText = "❌ Gagal kirim. Pastikan HP ada koneksi internet.";
                        }
                    };
                } else {
                    output.style.color = "#d9534f";
                    output.innerText = "⚠️ Browser HP tidak support NFC. Gunakan Chrome Android.";
                }
            } catch (error) {
                output.innerText = `Error: ${error}`;
            }
        });
    </script>
</body>
</html>
